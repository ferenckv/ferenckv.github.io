name: Build & verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # reads 3.4.10 from the repo, stays DRY
          bundler-cache: true           # installs the bundler from Gemfile.lock + caches gems

      - name: Build & check HTML
        run: bundle exec rake htmlproof